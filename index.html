<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control de Jornada</title>
    <meta name="theme-color" content="#0d0f15">
    <style>
        :root {
            --bg: #0d0f15;
            --card: #161a23;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f2f5;
            --muted: #8a919e;
            --accent: #0a84ff;
            --success: #30d158;
            --danger: #ff453a;
            --radius: 14px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .title { font-size: 1.15rem; font-weight: 700; }
        .badge-status { background: rgba(48, 209, 88, 0.15); color: var(--success); font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .card-bolsa {
            background: linear-gradient(145deg, rgba(10, 132, 255, 0.15), rgba(22, 26, 35, 0.9));
            border-color: rgba(10, 132, 255, 0.3);
            text-align: center;
        }
        .bolsa-val { font-size: 2.3rem; font-weight: 800; margin: 4px 0; letter-spacing: -0.5px; }

        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; }

        .date-control {
            display: flex; gap: 10px; align-items: center;
            background: rgba(0,0,0,0.25); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px 12px; margin-bottom: 12px;
        }
        input[type="date"] {
            background: none; border: none; color: #fff; font-size: 1rem;
            font-weight: 600; font-family: inherit; outline: none; width: 100%;
        }
        .dia-badge { font-weight: 700; font-size: 0.95rem; color: var(--success); white-space: nowrap; }

        .tramo {
            display: flex; gap: 8px; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 8px 10px; border-radius: 8px; margin-bottom: 8px;
        }
        input[type="time"] {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            color: #fff; padding: 6px 8px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; outline: none;
        }
        .btn-del { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; padding: 4px; }
        .btn-add {
            width: 100%; padding: 10px; background: rgba(10, 132, 255, 0.15); color: var(--accent);
            border: 1px dashed var(--accent); border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
        }

        .actions-grid { display: flex; gap: 4px; margin-top: 10px; }
        .act-btn {
            flex: 1; padding: 8px 2px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: var(--muted); border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
        }
        .act-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

        .progress-bar-wrap { background: rgba(255,255,255,0.08); height: 18px; border-radius: 10px; overflow: hidden; position: relative; margin: 10px 0; }
        .progress-bar { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-txt { position: absolute; width: 100%; text-align: center; line-height: 18px; font-size: 0.7rem; font-weight: 700; color: #fff; }

        .day-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .day-row:last-child { border-bottom: none; }

        .accordion-btn {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: none; border: none; color: var(--text); padding: 0; cursor: pointer; font-family: inherit;
        }
        .accordion-content { display: none; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
        .accordion-content.open { display: block; }
        .arrow { font-size: 0.75rem; color: var(--accent); transition: transform 0.2s; }
        .arrow.open { transform: rotate(180deg); }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--border); font-weight: 600; }
        td { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .text-r { text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">Control de Jornada</div>
        <div class="badge-status">● Oficial</div>
    </div>

    <!-- 1. BOLSA DE HORAS OFICIAL -->
    <div class="card card-bolsa">
        <div class="label" style="color: var(--accent);">Bolsa de Horas Total Acumulada</div>
        <div class="bolsa-val" id="totalBolsa" style="color: var(--danger);">-19:26</div>
        <div style="font-size: 0.75rem; color: var(--muted);">Oficial consolidado (corte a 09/09 con salida de las 20:15)</div>
    </div>

    <!-- 2. REGISTRO INTEGRADO DEL DÍA -->
    <div class="card">
        <div class="row-header">
            <span class="label">Registro Diario</span>
            <span class="dia-badge" id="diaHorasTotal">0h 00m</span>
        </div>

        <div class="date-control">
            <input type="date" id="fechaSel" onchange="seleccionarFecha()">
        </div>

        <div id="tramosLista"></div>

        <button class="btn-add" id="btnAdd" onclick="nuevoTramo()">+ Añadir Tramo</button>

        <div class="actions-grid">
            <button class="act-btn" id="btnNormal" onclick="setIncidencia('normal')">Trabajo</button>
            <button class="act-btn" id="btnLibre" onclick="setIncidencia('libre')">Compensado</button>
            <button class="act-btn" id="btnVac" onclick="setIncidencia('vacaciones')">Vacaciones</button>
            <button class="act-btn" id="btnAus" onclick="setIncidencia('ausencia')">Falta S004</button>
        </div>
    </div>

    <!-- 3. TERMÓMETRO SEMANAL (OBJETIVO 35H) -->
    <div class="card">
        <div class="row-header">
            <span class="label">Semana Actual (Objetivo 35h)</span>
            <span id="semanaEstadoTxt" style="font-size: 0.8rem; font-weight: 700; color: var(--accent);">10h 13m restantes</span>
        </div>

        <div class="progress-bar-wrap">
            <div class="progress-bar" id="pBar"></div>
            <div class="progress-txt" id="pTxt">0%</div>
        </div>

        <div id="semanaDiasDesglose"></div>
    </div>

    <!-- 4. RESUMEN MENSUAL OFICIAL (DESPLEGABLE) -->
    <div class="card">
        <button class="accordion-btn" onclick="toggleAcc('accMeses', 'arrMeses')">
            <span class="label">Resumen Mensual Oficial</span>
            <span class="arrow" id="arrMeses">▼</span>
        </button>
        <div class="accordion-content" id="accMeses">
            <table>
                <thead>
                    <tr>
                        <th>Mes</th>
                        <th class="text-r">Fichado</th>
                        <th class="text-r">Teórico</th>
                        <th class="text-r">Saldo</th>
                    </tr>
                </thead>
                <tbody id="tablaMesesBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 5. DETALLE DIARIO COMPLETO (DESPLEGABLE) -->
    <div class="card">
        <button class="accordion-btn" onclick="toggleAcc('accDiario', 'arrDiario')">
            <span class="label">Historial Diario 2026</span>
            <span class="arrow" id="arrDiario">▼</span>
        </button>
        <div class="accordion-content" id="accDiario">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                <span id="mesHistorialTxt" style="font-weight:700; font-size:0.85rem;">Septiembre 2026</span>
                <div>
                    <button class="act-btn" style="padding:4px 8px;" onclick="cambiarMes(-1)">&lt;</button>
                    <button class="act-btn" style="padding:4px 8px;" onclick="cambiarMes(1)">&gt;</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Tramos</th>
                        <th class="text-r">Horas</th>
                    </tr>
                </thead>
                <tbody id="tablaDiarioBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // SALDO BASE CONSOLIDADO AL CIERRE DEL 09/09/2026 (EN MINUTOS)
    // -23h 55m (informe oficial) + 04h 29m (salida 20:15 del 08/09) = -19h 26m (-1166 min)
    const SALDO_OFICIAL_BASE_MINUTOS = -(19 * 60 + 26);

    // DATOS DE SEPTIEMBRE BASE (Días 1 a 9 oficiales con salida a las 20:15)
    const datosSeptiembre = {
        "2026-09-01": { inc: "normal", tramos: [{ e: "11:28", s: "20:03" }] }, // 08:35
        "2026-09-02": { inc: "normal", tramos: [{ e: "11:44", s: "20:02" }] }, // 08:18
        "2026-09-03": { inc: "normal", tramos: [{ e: "11:40", s: "20:04" }] }, // 08:24
        "2026-09-04": { inc: "ausencia", tramos: [] },                          // Falta S004 (-07:00)
        "2026-09-07": { inc: "normal", tramos: [{ e: "08:02", s: "15:00" }] }, // 06:58
        "2026-09-08": { inc: "normal", tramos: [{ e: "09:45", s: "13:39" }, { e: "15:46", s: "20:15" }] }, // 08:23
        "2026-09-09": { inc: "normal", tramos: [{ e: "15:46", s: "20:30" }] }  // 04:44
    };

    // Almacenamiento independiente nuevo
    const STORAGE_KEY = "control_jornada_v10_clean";
    function cargarDB() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
        } catch(e) {}
        return JSON.parse(JSON.stringify(datosSeptiembre));
    }

    let db = cargarDB();
    let fechaActual = "2026-09-10";
    let mesVerAño = 2026, mesVerMes = 8; // Septiembre

    function guardarDB() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}
    }

    function calcMin(e, s) {
        if (!e || !s) return 0;
        const [h1, m1] = e.split(':').map(Number);
        const [h2, m2] = s.split(':').map(Number);
        return (h2 * 60 + m2) - (h1 * 60 + m1);
    }

    function calcMinDia(fecha) {
        const d = db[fecha];
        if (!d || d.inc !== 'normal' || !d.tramos) return 0;
        return d.tramos.reduce((acc, t) => acc + calcMin(t.e, t.s), 0);
    }

    function fmtMin(m, signo = false) {
        const neg = m < 0;
        const abs = Math.abs(Math.round(m));
        const h = Math.floor(abs / 60);
        const min = abs % 60;
        const s = neg ? '-' : (signo ? '+' : '');
        return `${s}${h}h ${String(min).padStart(2, '0')}m`;
    }

    function fmtHoras(m) {
        const neg = m < 0;
        const abs = Math.abs(Math.round(m));
        const h = Math.floor(abs / 60);
        const min = abs % 60;
        return `${neg ? '-' : ''}${h}:${String(min).padStart(2, '0')}`;
    }

    // Render día seleccionado
    function renderDia() {
        document.getElementById('fechaSel').value = fechaActual;
        const d = db[fechaActual] || { inc: 'normal', tramos: [] };
        
        ['btnNormal', 'btnLibre', 'btnVac', 'btnAus'].forEach(id => document.getElementById(id).classList.remove('active'));
        if (d.inc === 'normal') document.getElementById('btnNormal').classList.add('active');
        if (d.inc === 'libre') document.getElementById('btnLibre').classList.add('active');
        if (d.inc === 'vacaciones') document.getElementById('btnVac').classList.add('active');
        if (d.inc === 'ausencia') document.getElementById('btnAus').classList.add('active');

        const lista = document.getElementById('tramosLista');
        lista.innerHTML = '';

        if (d.inc === 'normal') {
            document.getElementById('btnAdd').style.display = 'block';
            (d.tramos || []).forEach((t, i) => {
                const row = document.createElement('div');
                row.className = 'tramo';
                row.innerHTML = `
                    <input type="time" value="${t.e}" onchange="updTramo(${i}, 'e', this.value)">
                    <span style="color:var(--muted); font-size:0.8rem;">a</span>
                    <input type="time" value="${t.s}" onchange="updTramo(${i}, 's', this.value)">
                    <button class="btn-del" onclick="delTramo(${i})">✕</button>
                `;
                lista.appendChild(row);
            });
        } else {
            document.getElementById('btnAdd').style.display = 'none';
            let txt = d.inc === 'vacaciones' ? '🌴 Vacaciones' : (d.inc === 'libre' ? '💤 Compensado' : '⚠️ Falta S004 (-07:00)');
            lista.innerHTML = `<div style="text-align:center; padding:12px; color:var(--muted); font-size:0.85rem;">${txt}</div>`;
        }

        const totalMin = calcMinDia(fechaActual);
        document.getElementById('diaHorasTotal').textContent = fmtMin(totalMin);
    }

    // Render termómetro de la semana
    function renderSemana() {
        const diasSemana = ['Lunes (7)', 'Martes (8)', 'Miércoles (9)', 'Jueves (10)', 'Viernes (11)', 'Sábado (12)', 'Domingo (13)'];
        const claves = ['2026-09-07', '2026-09-08', '2026-09-09', '2026-09-10', '2026-09-11', '2026-09-12', '2026-09-13'];
        
        let totalSemana = 0;
        const cont = document.getElementById('semanaDiasDesglose');
        cont.innerHTML = '';

        claves.forEach((k, idx) => {
            const m = calcMinDia(k);
            totalSemana += m;
            const d = db[k];
            let sub = 'Sin actividad';
            if (d && d.inc === 'normal' && d.tramos && d.tramos.length > 0) {
                sub = d.tramos.map(t => `${t.e}-${t.s}`).join(', ');
            } else if (d && d.inc !== 'normal') {
                sub = d.inc === 'ausencia' ? '⚠️ S004' : (d.inc === 'vacaciones' ? '🌴 Vacaciones' : '💤 Compensado');
            }

            const row = document.createElement('div');
            row.className = 'day-row';
            row.style.cursor = 'pointer';
            if (k === fechaActual) row.style.color = 'var(--accent)';
            row.onclick = () => { fechaActual = k; renderTodo(); };
            row.innerHTML = `
                <div>
                    <div style="font-weight:600;">${diasSemana[idx]}</div>
                    <div style="font-size:0.75rem; color:var(--muted);">${sub}</div>
                </div>
                <div style="font-weight:700;">${fmtMin(m)}</div>
            `;
            cont.appendChild(row);
        });

        const pct = Math.min(100, Math.round((totalSemana / (35 * 60)) * 100));
        document.getElementById('pBar').style.width = `${pct}%`;
        document.getElementById('pTxt').textContent = `${pct}% (${fmtMin(totalSemana)} / 35h)`;

        const rest = (35 * 60) - totalSemana;
        const estadoTxt = document.getElementById('semanaEstadoTxt');
        if (rest <= 0) {
            estadoTxt.textContent = `¡Cubierto! (+${fmtMin(Math.abs(rest))})`;
            estadoTxt.style.color = 'var(--success)';
        } else {
            estadoTxt.textContent = `${fmtMin(rest)} para 35h`;
            estadoTxt.style.color = 'var(--accent)';
        }
    }

    // Render Bolsa Total
    function renderBolsa() {
        // La bolsa parte exactamente de -19:26 y suma cualquier minuto fichado del 10/09 en adelante
        let extraMinutos = 0;
        Object.keys(db).forEach(k => {
            if (k >= "2026-09-10") {
                const fichado = calcMinDia(k);
                // Si es L-V tiene 7h de exigencia
                const dt = new Date(k + 'T00:00:00');
                const diaSem = dt.getDay();
                let teorico = (diaSem >= 1 && diaSem <= 5) ? (7 * 60) : 0;
                if (db[k].inc === 'vacaciones' || db[k].inc === 'libre') teorico = 0;
                extraMinutos += (fichado - teorico);
            }
        });

        const saldoFinal = SALDO_OFICIAL_BASE_MINUTOS + extraMinutos;
        const elem = document.getElementById('totalBolsa');
        elem.textContent = fmtHoras(saldoFinal);
        elem.style.color = saldoFinal >= 0 ? 'var(--success)' : 'var(--danger)';
    }

    // Meses oficiales
    function renderMeses() {
        const meses = [
            { n: "Enero 2026", f: "75:57", t: "95:12", s: "-19:15" },
            { n: "Febrero 2026", f: "117:05", t: "112:00", s: "+05:05" },
            { n: "Marzo 2026", f: "96:17", t: "106:24", s: "-10:07" },
            { n: "Abril 2026", f: "79:02", t: "89:12", s: "-10:10" },
            { n: "Mayo 2026", f: "99:08", t: "100:48", s: "-01:40" },
            { n: "Junio 2026", f: "149:58", t: "147:00", s: "+02:58" },
            { n: "Julio 2026", f: "175:12", t: "161:00", s: "+14:12" },
            { n: "Agosto 2026", f: "51:15", t: "42:00", s: "+09:15" },
            { n: "Septiembre 2026", f: "45:16", t: "49:00", s: "-03:44" }
        ];
        const tbody = document.getElementById('tablaMesesBody');
        tbody.innerHTML = meses.map(m => `
            <tr>
                <td>${m.n}</td>
                <td class="text-r">${m.f}</td>
                <td class="text-r">${m.t}</td>
                <td class="text-r" style="color:${m.s.startsWith('+')?'var(--success)':'var(--danger)'}; font-weight:600;">${m.s}</td>
            </tr>
        `).join('');
    }

    // Historial diario simple
    function renderHistorial() {
        const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        document.getElementById('mesHistorialTxt').textContent = `${nombresMeses[mesVerMes]} ${mesVerAño}`;
        const tbody = document.getElementById('tablaDiarioBody');
        tbody.innerHTML = '';

        if (mesVerAño === 2026 && mesVerMes === 8) {
            // Mostrar los días registrados de septiembre
            const keys = Object.keys(db).filter(k => k.startsWith('2026-09')).sort();
            tbody.innerHTML = keys.map(k => {
                const dia = parseInt(k.split('-')[2], 10);
                const d = db[k];
                let desc = '-';
                if (d.inc === 'normal' && d.tramos && d.tramos.length > 0) desc = d.tramos.map(t=>`${t.e}-${t.s}`).join(', ');
                else if (d.inc === 'ausencia') desc = 'Ausencia S004';
                else if (d.inc === 'vacaciones') desc = 'Vacaciones';
                else if (d.inc === 'libre') desc = 'Compensado';
                return `
                    <tr>
                        <td><strong>${dia}</strong></td>
                        <td style="font-size:0.75rem; color:var(--muted);">${desc}</td>
                        <td class="text-r" style="font-weight:600;">${fmtMin(calcMinDia(k))}</td>
                    </tr>
                `;
            }).join('');
        } else {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--muted); padding:10px;">Mes cerrado en informe oficial</td></tr>`;
        }
    }

    function toggleAcc(idContent, idArr) {
        const el = document.getElementById(idContent);
        const arr = document.getElementById(idArr);
        el.classList.toggle('open');
        arr.classList.toggle('open');
    }

    function seleccionarFecha() {
        fechaActual = document.getElementById('fechaSel').value;
        renderTodo();
    }

    function nuevoTramo() {
        if (!db[fechaActual]) db[fechaActual] = { inc: 'normal', tramos: [] };
        if (!db[fechaActual].tramos) db[fechaActual].tramos = [];
        db[fechaActual].tramos.push({ e: "15:45", s: "20:15" });
        guardarDB();
        renderTodo();
    }

    function updTramo(idx, campo, val) {
        if (db[fechaActual] && db[fechaActual].tramos && db[fechaActual].tramos[idx]) {
            db[fechaActual].tramos[idx][campo] = val;
            guardarDB();
            renderTodo();
        }
    }

    function delTramo(idx) {
        if (db[fechaActual] && db[fechaActual].tramos) {
            db[fechaActual].tramos.splice(idx, 1);
            guardarDB();
            renderTodo();
        }
    }

    function setIncidencia(tipo) {
        if (!db[fechaActual]) db[fechaActual] = { inc: tipo, tramos: [] };
        else db[fechaActual].inc = tipo;
        guardarDB();
        renderTodo();
    }

    function cambiarMes(delta) {
        mesVerMes += delta;
        if (mesVerMes < 0) { mesVerMes = 11; mesVerAño--; }
        if (mesVerMes > 11) { mesVerMes = 0; mesVerAño++; }
        renderHistorial();
    }

    function renderTodo() {
        renderDia();
        renderSemana();
        renderBolsa();
        renderMeses();
        renderHistorial();
    }

    document.addEventListener('DOMContentLoaded', renderTodo);
</script>
</body>
</html>
