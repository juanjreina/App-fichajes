<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Control de Jornada Pro</title>
    <meta name="theme-color" content="#0d0f15">
    <style>
        :root {
            --bg: #0d0f15;
            --card: #161a23;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f2f5;
            --muted: #8a919e;
            --accent: #0a84ff;
            --success: #30d158;
            --danger: #ff453a;
            --radius: 14px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px 16px 40px 16px;
            display: flex; flex-direction: column; align-items: center;
            user-select: none;
        }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .title { font-size: 1.15rem; font-weight: 700; }
        .badge-status { background: rgba(48, 209, 88, 0.15); color: var(--success); font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .card-bolsa {
            background: linear-gradient(145deg, rgba(10, 132, 255, 0.15), rgba(22, 26, 35, 0.9));
            border-color: rgba(10, 132, 255, 0.3);
            text-align: center;
        }
        .bolsa-val { font-size: 2.3rem; font-weight: 800; margin: 4px 0; letter-spacing: -0.5px; }

        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); font-weight: 700; }

        .date-control {
            display: flex; gap: 10px; align-items: center;
            background: rgba(0,0,0,0.25); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px 12px; margin-bottom: 12px;
        }
        input[type="date"] {
            background: none; border: none; color: #fff; font-size: 1rem;
            font-weight: 600; font-family: inherit; outline: none; width: 100%;
        }
        .dia-badge { font-weight: 700; font-size: 0.95rem; color: var(--success); white-space: nowrap; }

        .tramo {
            display: flex; gap: 8px; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 8px 10px; border-radius: 8px; margin-bottom: 8px;
        }
        input[type="time"] {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            color: #fff; padding: 6px 8px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; outline: none;
        }
        .btn-del { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; padding: 4px; }
        .btn-add {
            width: 100%; padding: 10px; background: rgba(10, 132, 255, 0.15); color: var(--accent);
            border: 1px dashed var(--accent); border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
        }

        .actions-grid { display: flex; gap: 4px; margin-top: 10px; }
        .act-btn {
            flex: 1; padding: 8px 2px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            color: var(--muted); border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
        }
        .act-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }

        .progress-bar-wrap { background: rgba(255,255,255,0.08); height: 18px; border-radius: 10px; overflow: hidden; position: relative; margin: 10px 0; }
        .progress-bar { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-txt { position: absolute; width: 100%; text-align: center; line-height: 18px; font-size: 0.7rem; font-weight: 700; color: #fff; }

        .day-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .day-row:last-child { border-bottom: none; }

        .accordion-btn {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: none; border: none; color: var(--text); padding: 0; cursor: pointer; font-family: inherit;
        }
        .accordion-content { display: none; margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
        .accordion-content.open { display: block !important; }
        .arrow { font-size: 0.75rem; color: var(--accent); transition: transform 0.2s; }
        .arrow.open { transform: rotate(180deg); }

        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--border); font-weight: 600; }
        td { padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .text-r { text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">Control de Jornada</div>
        <div class="badge-status">● Oficial</div>
    </div>

    <!-- 1. BOLSA DE HORAS OFICIAL -->
    <div class="card card-bolsa">
        <div class="label" style="color: var(--accent);">Bolsa de Horas Total Acumulada</div>
        <div class="bolsa-val" id="totalBolsa" style="color: var(--danger);">-19:26</div>
        <div style="font-size: 0.75rem; color: var(--muted);">Saldo consolidado frente a la administración</div>
    </div>

    <!-- 2. REGISTRO INTEGRADO DEL DÍA -->
    <div class="card">
        <div class="row-header">
            <span class="label">Registro Diario</span>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="act-btn" style="padding: 3px 8px;" onclick="irAHoy()">Hoy</button>
                <span class="dia-badge" id="diaHorasTotal">0h 00m</span>
            </div>
        </div>

        <div class="date-control">
            <input type="date" id="fechaSel" onchange="seleccionarFecha()">
        </div>

        <div id="tramosLista"></div>

        <button class="btn-add" id="btnAdd" onclick="nuevoTramo()">+ Añadir Tramo</button>

        <div class="actions-grid">
            <button class="act-btn" id="btnNormal" onclick="setIncidencia('normal')">Trabajo</button>
            <button class="act-btn" id="btnLibre" onclick="setIncidencia('libre')">Compensado</button>
            <button class="act-btn" id="btnVac" onclick="setIncidencia('vacaciones')">Vacaciones</button>
            <button class="act-btn" id="btnAus" onclick="setIncidencia('ausencia')">Falta S004</button>
        </div>
    </div>

    <!-- 3. TERMÓMETRO SEMANAL DINÁMICO (OBJETIVO 35H) -->
    <div class="card">
        <div class="row-header">
            <span class="label" id="tituloTermometro">Semana Actual (Objetivo 35h)</span>
            <span id="semanaEstadoTxt" style="font-size: 0.8rem; font-weight: 700; color: var(--accent);">35h 00m restantes</span>
        </div>

        <div class="progress-bar-wrap">
            <div class="progress-bar" id="pBar"></div>
            <div class="progress-txt" id="pTxt">0%</div>
        </div>

        <div id="semanaDiasDesglose"></div>
    </div>

    <!-- 4. RESUMEN MENSUAL OFICIAL (DESPLEGABLE) -->
    <div class="card">
        <button class="accordion-btn" onclick="toggleAcc('accMeses', 'arrMeses')">
            <span class="label">Resumen Mensual Oficial</span>
            <span class="arrow" id="arrMeses">▼</span>
        </button>
        <div class="accordion-content" id="accMeses">
            <table>
                <thead>
                    <tr>
                        <th>Mes</th>
                        <th class="text-r">Fichado</th>
                        <th class="text-r">Teórico</th>
                        <th class="text-r">Saldo</th>
                    </tr>
                </thead>
                <tbody id="tablaMesesBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 5. DETALLE DIARIO COMPLETO (DESPLEGABLE) -->
    <div class="card">
        <button class="accordion-btn" onclick="toggleAcc('accDiario', 'arrDiario')">
            <span class="label">Historial Diario Completo</span>
            <span class="arrow" id="arrDiario">▼</span>
        </button>
        <div class="accordion-content" id="accDiario">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
                <span id="mesHistorialTxt" style="font-weight:700; font-size:0.85rem;">Septiembre 2026</span>
                <div>
                    <button class="act-btn" style="padding:4px 8px;" onclick="cambiarMes(-1)">&lt;</button>
                    <button class="act-btn" style="padding:4px 8px;" onclick="cambiarMes(1)">&gt;</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Tramos</th>
                        <th class="text-r">Horas</th>
                    </tr>
                </thead>
                <tbody id="tablaDiarioBody"></tbody>
            </table>
        </div>
    </div>
</div>

    var STORAGE_KEY = "control_jornada_v15_resilient";

    function cargarDB() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
        } catch(e) {}
        return JSON.parse(JSON.stringify(baseHistorica));
    }

    var db = cargarDB();

    function obtenerFechaHoyISO() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
    }

    var fechaActual = obtenerFechaHoyISO();
    var partesHoy = fechaActual.split('-');
    var mesVerAño = parseInt(partesHoy[0], 10);
    var mesVerMes = parseInt(partesHoy[1], 10) - 1;

    function guardarDB() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) {}
    }

    function calcMin(e, s) {
        if (!e || !s) return 0;
        var p1 = e.split(':').map(Number);
        var p2 = s.split(':').map(Number);
        return (p2[0] * 60 + p2[1]) - (p1[0] * 60 + p1[1]);
    }

    function calcMinDia(fecha) {
        var d = db[fecha];
        if (!d || d.inc !== 'normal' || !d.tramos) return 0;
        var total = 0;
        for (var i = 0; i < d.tramos.length; i++) {
            total += calcMin(d.tramos[i].e, d.tramos[i].s);
        }
        return total;
    }

    function fmtMin(m, signo) {
        var neg = m < 0;
        var abs = Math.abs(Math.round(m));
        var h = Math.floor(abs / 60);
        var min = abs % 60;
        var s = neg ? '-' : (signo ? '+' : '');
        return s + h + 'h ' + String(min).padStart(2, '0') + 'm';
    }

    function fmtHoras(m) {
        var neg = m < 0;
        var abs = Math.abs(Math.round(m));
        var h = Math.floor(abs / 60);
        var min = abs % 60;
        return (neg ? '-' : '') + h + ':' + String(min).padStart(2, '0');
    }

    function obtenerLunes(fechaStr) {
        var p = fechaStr.split('-').map(Number);
        var date = new Date(p[0], p[1] - 1, p[2]);
        var dia = date.getDay();
        var diff = dia === 0 ? -6 : 1 - dia;
        date.setDate(date.getDate() + diff);
        return date;
    }

    function renderDia() {
        var inputF = document.getElementById('fechaSel');
        if (inputF) inputF.value = fechaActual;
        var d = db[fechaActual] || { inc: 'normal', tramos: [] };
        
        ['btnNormal', 'btnLibre', 'btnVac', 'btnAus'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.classList.remove('active');
        });
        if (d.inc === 'normal') document.getElementById('btnNormal').classList.add('active');
        if (d.inc === 'libre') document.getElementById('btnLibre').classList.add('active');
        if (d.inc === 'vacaciones') document.getElementById('btnVac').classList.add('active');
        if (d.inc === 'ausencia') document.getElementById('btnAus').classList.add('active');

        var lista = document.getElementById('tramosLista');
        lista.innerHTML = '';

        if (d.inc === 'normal') {
            document.getElementById('btnAdd').style.display = 'block';
            if (d.tramos) {
                d.tramos.forEach(function(t, i) {
                    var row = document.createElement('div');
                    row.className = 'tramo';
                    row.innerHTML = 
                        '<input type="time" value="' + t.e + '" onchange="updTramo(' + i + ', \'e\', this.value)">' +
                        '<span style="color:var(--muted); font-size:0.8rem;">a</span>' +
                        '<input type="time" value="' + t.s + '" onchange="updTramo(' + i + ', \'s\', this.value)">' +
                        '<button class="btn-del" onclick="delTramo(' + i + ')">✕</button>';
                    lista.appendChild(row);
                });
            }
        } else {
            document.getElementById('btnAdd').style.display = 'none';
            var txt = d.inc === 'vacaciones' ? '🌴 Vacaciones' : (d.inc === 'libre' ? '💤 Compensado' : '⚠️ Falta S004 (-07:00)');
            lista.innerHTML = '<div style="text-align:center; padding:12px; color:var(--muted); font-size:0.85rem;">' + txt + '</div>';
        }

        var totalMin = calcMinDia(fechaActual);
        document.getElementById('diaHorasTotal').textContent = fmtMin(totalMin, false);
    }

    function renderSemana() {
        var lunes = obtenerLunes(fechaActual);
        var nombresDias = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
        var totalSemana = 0;
        var cont = document.getElementById('semanaDiasDesglose');
        cont.innerHTML = '';

        var domingo = new Date(lunes);
        domingo.setDate(lunes.getDate() + 6);
        document.getElementById('tituloTermometro').textContent = 'Semana (' + lunes.getDate() + '/' + (lunes.getMonth()+1) + ' - ' + domingo.getDate() + '/' + (domingo.getMonth()+1) + ')';

        for (var i = 0; i < 7; i++) {
            var cur = new Date(lunes);
            cur.setDate(lunes.getDate() + i);
            var y = cur.getFullYear();
            var m = String(cur.getMonth() + 1).padStart(2, '0');
            var day = String(cur.getDate()).padStart(2, '0');
            var k = y + '-' + m + '-' + day;

            var minutosDia = calcMinDia(k);
            totalSemana += minutosDia;

            var d = db[k];
            var sub = 'Sin actividad';
            if (d && d.inc === 'normal' && d.tramos && d.tramos.length > 0) {
                sub = d.tramos.map(function(t){ return t.e + '-' + t.s; }).join(', ');
            } else if (d && d.inc !== 'normal') {
                sub = d.inc === 'ausencia' ? '⚠️ S004' : (d.inc === 'vacaciones' ? '🌴 Vacaciones' : '💤 Compensado');
            }

            var row = document.createElement('div');
            row.className = 'day-row';
            row.style.cursor = 'pointer';
            if (k === fechaActual) row.style.color = 'var(--accent)';
            row.setAttribute('data-fecha', k);
            row.onclick = (function(fechaTarget) {
                return function() {
                    fechaActual = fechaTarget;
                    renderTodo();
                };
            })(k);

            row.innerHTML = 
                '<div>' +
                    '<div style="font-weight:600;">' + nombresDias[i] + ' (' + cur.getDate() + ')</div>' +
                    '<div style="font-size:0.75rem; color:var(--muted);">' + sub + '</div>' +
                '</div>' +
                '<div style="font-weight:700;">' + fmtMin(minutosDia, false) + '</div>';
            cont.appendChild(row);
        }

        var pct = Math.min(100, Math.round((totalSemana / (35 * 60)) * 100));
        document.getElementById('pBar').style.width = pct + '%';
        document.getElementById('pTxt').textContent = pct + '% (' + fmtMin(totalSemana, false) + ' / 35h)';

        var rest = (35 * 60) - totalSemana;
        var estadoTxt = document.getElementById('semanaEstadoTxt');
        if (rest <= 0) {
            estadoTxt.textContent = '¡Cubierto! (+' + fmtMin(Math.abs(rest), false) + ')';
            estadoTxt.style.color = 'var(--success)';
        } else {
            estadoTxt.textContent = fmtMin(rest, false) + ' para 35h';
            estadoTxt.style.color = 'var(--accent)';
        }
    }

    function renderBolsa() {
        var extraMinutos = 0;
        Object.keys(db).forEach(function(k) {
            if (k >= "2026-09-10") {
                var fichado = calcMinDia(k);
                var p = k.split('-').map(Number);
                var diaSem = new Date(p[0], p[1] - 1, p[2]).getDay();
                var teorico = (diaSem >= 1 && diaSem <= 5) ? (7 * 60) : 0;
                if (db[k].inc === 'vacaciones' || db[k].inc === 'libre') teorico = 0;
                extraMinutos += (fichado - teorico);
            }
        });

        var saldoFinal = SALDO_BASE_MINUTOS + extraMinutos;
        var elem = document.getElementById('totalBolsa');
        elem.textContent = fmtHoras(saldoFinal);
        elem.style.color = saldoFinal >= 0 ? 'var(--success)' : 'var(--danger)';
    }

            tr.innerHTML = '<td>' + m.n + '</td><td class="text-r">' + m.f + '</td><td class="text-r">' + m.t + '</td><td class="text-r" style="color:' + color + '; font-weight:600;">' + m.s + '</td>';

    function renderHistorial() {
        var nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        document.getElementById('mesHistorialTxt').textContent = nombresMeses[mesVerMes] + ' ' + mesVerAño;
        var tbody = document.getElementById('tablaDiarioBody');
        tbody.innerHTML = '';

        var prefix = mesVerAño + '-' + String(mesVerMes + 1).padStart(2, '0');
        var keys = Object.keys(db).filter(function(k) { return k.indexOf(prefix) === 0; }).sort();

        if (keys.length > 0) {
            keys.forEach(function(k) {
                var dia = parseInt(k.split('-')[2], 10);
                var d = db[k];
                var desc = '-';
                if (d.inc === 'normal' && d.tramos && d.tramos.length > 0) {
                    desc = d.tramos.map(function(t){ return t.e + '-' + t.s; }).join(', ');
                } else if (d.inc === 'ausencia') desc = 'Ausencia S004';
                else if (d.inc === 'vacaciones') desc = 'Vacaciones';
                else if (d.inc === 'libre') desc = 'Compensado';

                var tr = document.createElement('tr');
                tr.innerHTML = '<td><strong>' + dia + '</strong></td><td style="font-size:0.75rem; color:var(--muted);">' + desc + '</td><td class="text-r" style="font-weight:600;">' + fmtMin(calcMinDia(k), false) + '</td>';
                tbody.appendChild(tr);
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--muted); padding:10px;">Sin registros en este mes</td></tr>';
        }
    }

    function toggleAcc(idContent, idArr) {
        var el = document.getElementById(idContent);
        var arr = document.getElementById(idArr);
        if (el && arr) {
            el.classList.toggle('open');
            arr.classList.toggle('open');
        }

    function seleccionarFecha() {
        fechaActual = document.getElementById('fechaSel').value;
        var p = fechaActual.split('-').map(Number);
        mesVerAño = p[0];
        mesVerMes = p[1] - 1;
        renderTodo();
    }

    function irAHoy() {
        fechaActual = obtenerFechaHoyISO();
        var p = fechaActual.split('-').map(Number);
        mesVerAño = p[0];
        mesVerMes = p[1] - 1;
        renderTodo();
    }

    function nuevoTramo() {
        if (!db[fechaActual]) db[fechaActual] = { inc: 'normal', tramos: [] };
        if (!db[fechaActual].tramos) db[fechaActual].tramos = [];
        
        var eDef = "15:45", sDef = "20:15";
        if (fechaActual === obtenerFechaHoyISO()) {
            var now = new Date();
            eDef = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            var fin = new Date(now.getTime() + 4 * 3600 * 1000);
            sDef = String(fin.getHours()).padStart(2, '0') + ':' + String(fin.getMinutes()).padStart(2, '0');
        }

        db[fechaActual].tramos.push({ e: eDef, s: sDef });
        guardarDB();
        renderTodo();
    }

    function updTramo(idx, campo, val) {
        if (db[fechaActual] && db[fechaActual].tramos && db[fechaActual].tramos[idx]) {
            db[fechaActual].tramos[idx][campo] = val;
            guardarDB();
            renderTodo();
        }
    }

    function delTramo(idx) {
        if (db[fechaActual] && db[fechaActual].tramos) {
            db[fechaActual].tramos.splice(idx, 1);
            guardarDB();
            renderTodo();
        }
    }

    function setIncidencia(tipo) {
        if (!db[fechaActual]) db[fechaActual] = { inc: tipo, tramos: [] };
        else db[fechaActual].inc = tipo;
        guardarDB();
        renderTodo();
    }

    function cambiarMes(delta) {
        mesVerMes += delta;
        if (mesVerMes < 0) { mesVerMes = 11; mesVerAño--; }
        if (mesVerMes > 11) { mesVerMes = 0; mesVerAño++; }
        renderHistorial();
    }

    function renderTodo() {
        renderDia();
        renderSemana();
        renderBolsa();
        renderMeses();
        renderHistorial();
    }

    window.onload = function() {
        irAHoy();
    };
